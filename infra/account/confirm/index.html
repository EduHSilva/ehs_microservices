<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmar conta — EHS Solutions</title>
  <meta name="theme-color" content="#4F46E5">
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #4f46e5;
      --danger: #b91c1c;
      --success: #047857;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #111a2e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #1e293b;
        --primary: #818cf8;
        --danger: #f87171;
        --success: #34d399;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 45px -30px rgba(15, 23, 42, .45);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand-mark {
      display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--primary); color: #fff; font-weight: 800;
    }
    .brand span { color: var(--muted); font-size: .85rem; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .subtitle { color: var(--muted); font-size: .92rem; margin: 0 0 20px; }
    .status {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .9rem;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status.success { color: var(--success); border-color: currentColor; }
    .status.error { color: var(--danger); border-color: currentColor; }
    .actions { margin-top: 20px; }
    .button {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    .button.secondary { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    .footer { margin-top: 22px; font-size: .85rem; color: var(--muted); text-align: center; }
    a { color: var(--primary); }
    .spinner { display: inline-block; width: 14px; height: 14px; margin-right: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="brand-mark">EHS</span>
      <span><strong>EHS Solutions</strong><br><span>Confirmação de conta</span></span>
    </div>

    <h1>Confirmando seu cadastro</h1>
    <p class="subtitle">Aguarde um instante enquanto validamos o link recebido por e-mail.</p>

    <div class="status" id="status"><span class="spinner"></span>Validando…</div>

    <div class="actions" id="actions" hidden>
      <a class="button" href="/app/">Ir para os aplicativos</a>
    </div>

    <p class="footer">
      Precisa de ajuda? <a href="mailto:edu.slhenrique@gmail.com">edu.slhenrique@gmail.com</a>
    </p>
  </main>

  <script>
    (function () {
      var status = document.getElementById('status')
      var actions = document.getElementById('actions')

      function show(kind, text) {
        status.className = 'status ' + kind
        status.textContent = text
      }

      function linkFromPath() {
        var parts = window.location.pathname.split('/').filter(Boolean)
        return parts.length >= 3 && parts[0] === 'user' && parts[1] === 'confirm' ? parts[2] : ''
      }

      var id = linkFromPath()
      var uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i

      if (!id || !uuid.test(id)) {
        show('error', 'Link de confirmação inválido. Abra o link exatamente como recebeu no e-mail.')
        actions.hidden = false
        return
      }

      fetch('/users/confirm/' + encodeURIComponent(id), {
        headers: { 'Accept': 'application/json' }
      })
        .then(function (response) {
          return response.json().catch(function () { return null }).then(function (payload) {
            return { ok: response.ok, status: response.status, payload: payload }
          })
        })
        .then(function (result) {
          if (result.ok) {
            show('success', 'Cadastro confirmado! Você já pode entrar nos aplicativos com seu e-mail e senha.')
          } else if (result.status === 400) {
            show('success', 'Este link já foi usado ou a conta já está ativa. Basta entrar nos aplicativos.')
          } else if (result.status === 404) {
            show('error', 'Não encontramos uma conta para este link. Verifique o e-mail recebido.')
          } else {
            show('error', 'Não foi possível confirmar agora. Tente novamente em alguns minutos.')
          }
          actions.hidden = false
        })
        .catch(function () {
          show('error', 'Não foi possível falar com o servidor. Verifique sua conexão e recarregue a página.')
          actions.hidden = false
        })
    })()
  </script>
</body>
</html>
