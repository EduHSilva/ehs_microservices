# Dev: painéis internos publicados via nginx.
# Em prod este arquivo é sobrescrito por infra/nginx/prod/snippets/internal.conf.

# Painel de management do RabbitMQ na mesma origem (sem publicar a 15672).
# O RabbitMQ roda com management.path_prefix = /rabbitmq.
location = /rabbitmq {
    return 302 /rabbitmq/;
}

location /rabbitmq/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rabbitmq http://rabbitmq:15672;
    proxy_pass $rabbitmq$request_uri;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /errors/50x.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location = /admin {
    return 302 /admin/;
}

location /admin/ {
    proxy_pass http://admin:9091/;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /errors/50x.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /admin;
}
