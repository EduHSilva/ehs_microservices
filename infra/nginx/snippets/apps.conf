# Painéis internos: Spring Boot Admin (/admin) e RabbitMQ (/rabbitmq).
# Em dev este arquivo vem de snippets/internal.conf (proxy normal); em prod o
# compose sobrescreve com prod/snippets/internal.conf, que responde 404.
# O location /admin/ aqui também sombreia a rota lb://admin do gateway.
include /etc/nginx/snippets/internal.conf;

# Páginas centrais de conta (estáticas, sem build): privacidade, reset de senha,
# confirmação de cadastro e vínculo de acesso a aplicativo.
location = /app/privacidade {
    return 302 /app/privacidade/;
}

location /app/privacidade/ {
    root /usr/share/nginx/html;
    # O arquivo precisa ser o primeiro argumento: como fallback ele viraria redirect
    # interno e cairia no location /, que encaminha para o gateway.
    try_files /account/privacidade/index.html =404;
}

# Mesmo caminho que o users envia no e-mail (PASSWORD_RESET_PATH).
location = /user/reset-password {
    root /usr/share/nginx/html;
    try_files /account/reset-password/index.html =404;
}

# Link de confirmação de cadastro: /user/confirm/{id} (a página lê o id da URL).
location = /user/confirm {
    return 302 /user/confirm/;
}

location = /user/confirm/ {
    root /usr/share/nginx/html;
    try_files /account/confirm/index.html =404;
}

# As chaves de {36} precisam de aspas, senão o nginx as lê como bloco.
location ~ "^/user/confirm/[0-9a-fA-F-]{36}/?$" {
    root /usr/share/nginx/html;
    try_files /account/confirm/index.html =404;
}

# Link de vínculo de acesso a outra aplicação (APP_ACCESS_PATH).
location = /user/app-access {
    root /usr/share/nginx/html;
    try_files /account/app-access/index.html =404;
}

location /user/app-access/ {
    root /usr/share/nginx/html;
    try_files /account/app-access/index.html =404;
}

location / {
    proxy_pass http://gateway:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Substitui o Whitelabel do Spring por uma página de erro para navegadores;
    # respostas JSON (APIs) passam intactas pelo @gw404_replay.
    proxy_intercept_errors on;
    error_page 404 $error_404_page;
    error_page 500 502 503 504 /errors/50x.html;
}

# Reemissão do 404 do gateway para clientes de API. recursive_error_pages fica
# desligado (padrão), então o segundo 404 passa com o corpo original.
location @gw404_replay {
    proxy_pass http://gateway:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
