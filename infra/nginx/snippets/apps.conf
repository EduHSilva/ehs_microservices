# Rotas comuns dos apps, compartilhadas entre o server HTTP de dev (conf.d)
# e o server de produção (prod/). Incluído dentro de um bloco server.

# Páginas de erro próprias (arquivos em infra/platform/errors).
# O 404 do gateway é tratado no location / (ver map $error_404_page no nginx.conf).
error_page 404 /errors/404.html;

# Servido apenas via error_page.
location /errors/ {
    internal;
    root /usr/share/nginx/html/platform;
}

# Raiz: landing estática (página única, sem build).
location = / {
    root /usr/share/nginx/html;
    try_files /platform/index.html =404;
}

# O antigo hub de aplicativos virou a própria landing.
location = /app {
    return 301 /;
}

location = /app/ {
    return 301 /;
}

# Atalho antigo do admin.

location = /painel {
    return 302 /app/admin/;
}

location /painel/ {
    rewrite ^/painel/(.*)$ /app/admin/$1 permanent;
}

location = /app/study {
    return 302 /app/study/;
}

location /app/study/ {
    # Resolver do Docker: o nginx não falha ao subir se o study-ui
    # ainda não estiver rodando (o container é de outro compose).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $study_ui http://study-ui:80;
    proxy_pass $study_ui$request_uri;

    proxy_intercept_errors on;
    error_page 500 502 503 504 /errors/50x.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /app/study;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

