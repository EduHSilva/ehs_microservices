# Produção: HTTPS canônico em www.appsehs.com.
# O certificado é emitido pelo serviço `certbot` (webroot em /var/www/certbot)
# e renovado automaticamente; o nginx recarrega a cada 6h (ver compose).

# IP literal ou SNI desconhecido: rejeita o handshake TLS (não entrega o certificado).
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.appsehs.com;

    ssl_certificate     /etc/letsencrypt/live/www.appsehs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.appsehs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # add_header no server substitui os herdados do http, então repito os três.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/apps.conf;
}

# Apex redireciona para o canônico www (mesmo certificado, com os dois nomes).
server {
    listen 443 ssl;
    http2 on;
    server_name appsehs.com;

    ssl_certificate     /etc/letsencrypt/live/www.appsehs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.appsehs.com/privkey.pem;

    return 301 https://www.appsehs.com$request_uri;
}
