# Produção: entrada pública pelo domínio appsehs.com.
# Tudo redireciona para o HTTPS canônico em www.appsehs.com, exceto o desafio ACME.

# IP literal ou Host desconhecido: encerra a conexão sem responder.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name www.appsehs.com appsehs.com;

    # Webroot do Certbot (HTTP-01) — resposta direta, antes do redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.appsehs.com$request_uri;
    }
}
