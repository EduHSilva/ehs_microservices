# Produção: entrada pública pelo domínio appsehs.com.
server {
    listen 80;
    server_name www.appsehs.com appsehs.com;

    # Webroot do Certbot (HTTP-01) — resposta direta, antes do proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/snippets/apps.conf;
}
