# Produção: Spring Boot Admin, RabbitMQ e endpoints actuator não são publicados.
# Acesso ao admin/rabbitmq por túnel SSH (portas ligadas em 127.0.0.1 no compose):
#   ssh -L 9091:127.0.0.1:9091 -L 15672:127.0.0.1:15672 user@host
#   admin: http://localhost:9091  |  rabbitmq: http://localhost:15672/rabbitmq/
# O 404 em /admin/ também sombreia a rota lb://admin exposta pelo gateway.
# O SBA continua lendo os actuators direto pela rede interna do Docker.

location = /admin {
    return 404;
}

location /admin/ {
    return 404;
}

location = /rabbitmq {
    return 404;
}

location /rabbitmq/ {
    return 404;
}

# Actuator do próprio gateway (via location /) e dos serviços pelo discovery
# locator do gateway (/{servico}/actuator/...). Verificado após os prefixos,
# não afeta o admin nem os health checks internos.
location ~ "^/actuator(/|$)" {
    return 404;
}

location ~ "^/[^/]+/actuator(/|$)" {
    return 404;
}
