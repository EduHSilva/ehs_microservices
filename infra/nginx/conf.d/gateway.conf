server {
    listen 80;
    server_name _;

    # Atalhos antigos: /app/ era o StudyFlow e /painel/ era o admin.
    location = /app {
        return 302 /app/study/;
    }

    location = /app/ {
        return 302 /app/study/;
    }

    location = /painel {
        return 302 /app/admin/;
    }

    location /painel/ {
        rewrite ^/painel/(.*)$ /app/admin/$1 permanent;
    }

    location = /app/study {
        return 302 /app/study/;
    }

    location /app/study/ {
        # Resolver do Docker: o nginx não falha ao subir se o study-ui
        # ainda não estiver rodando (o container é de outro compose).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $study_ui http://study-ui:80;
        proxy_pass $study_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/study;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /app/admin {
        return 302 /app/admin/;
    }

    location /app/admin/ {
        # Painel administrativo (ehs_admin). Variável + resolver para o nginx
        # subir mesmo se o admin-ui estiver em outro compose.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_ui http://admin-ui:80;
        proxy_pass $admin_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/admin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /app/budgets {
        return 302 /app/budgets/;
    }

    location /app/budgets/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $budgets_ui http://budgets-ui:80;
        proxy_pass $budgets_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/budgets;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /app/finances {
        return 302 /app/finances/;
    }

    location /app/finances/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $finances_ui http://finances-ui:80;
        proxy_pass $finances_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/finances;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /app/fitness {
        return 302 /app/fitness/;
    }

    location /app/fitness/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fitness_ui http://fitness-ui:80;
        proxy_pass $fitness_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/fitness;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /app/portfolio {
        return 302 /app/portfolio/;
    }

    location /app/portfolio/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $portfolio_ui http://portfolio-ui:80;
        proxy_pass $portfolio_ui$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app/portfolio;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Painel de management do RabbitMQ na mesma origem (sem publicar a 15672).
    # O RabbitMQ roda com management.path_prefix = /rabbitmq.
    location = /rabbitmq {
        return 302 /rabbitmq/;
    }

    location /rabbitmq/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $rabbitmq http://rabbitmq:15672;
        proxy_pass $rabbitmq$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin:9091/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
    }

    # Páginas centrais de conta (estáticas, sem build): privacidade e reset de senha.
    location = /app/privacidade {
        return 302 /app/privacidade/;
    }

    location /app/privacidade/ {
        root /usr/share/nginx/html;
        # O arquivo precisa ser o primeiro argumento: como fallback ele viraria redirect
        # interno e cairia no location /, que encaminha para o gateway.
        try_files /account/privacidade/index.html =404;
    }

    # Mesmo caminho que o users envia no e-mail (PASSWORD_RESET_PATH).
    location = /user/reset-password {
        root /usr/share/nginx/html;
        try_files /account/reset-password/index.html =404;
    }

    location / {
        proxy_pass http://gateway:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
