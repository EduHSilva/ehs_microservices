spring.application.name=finances
server.port=8989

spring.datasource.url=jdbc:postgresql://localhost:5433/finances
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=3s
finances.notifications.enabled=${FINANCES_NOTIFICATIONS_ENABLED:true}
finances.notifications.queue=${NOTIFICATIONS_QUEUE:default.notifications}
finances.invite.ttl-hours=${FINANCES_INVITE_TTL_HOURS:168}
finances.invite.url-base=${SERVER_URL:http://localhost}
finances.invite.path=${FINANCES_INVITE_PATH:/app/finances/?invite=}
finances.users-service-url=${USERS_SERVICE_URL:}
finances.internal-token=${INTERNAL_TOKEN:}

server.max-http-request-header-size=64KB

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.metadata-map.swagger-url=${SERVER_URL:http://localhost}/finances/swagger-ui/index.html
server.forward-headers-strategy=framework

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/finances/v3/api-docs
springdoc.swagger-ui.config-url=/finances/v3/api-docs/swagger-config

management.endpoints.web.exposure.include=health,info,metrics,loggers,logfile
management.endpoint.health.show-details=always
logging.file.name=${LOG_FILE:/tmp/app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
