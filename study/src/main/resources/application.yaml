spring:
  application:
    name: study
  datasource:
    url: jdbc:postgresql://localhost:5433/study
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info

    metadata-map:
      swagger-url: http://localhost/study/swagger-ui/index.html
server:
  port: 9191
  forward-headers-strategy: framework
tasks:
  service:
    url: ${TASKS_SERVICE_URL:http://localhost:8686}

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - loggers
          - logfile
logging:
  file:
    name: ${LOG_FILE:/tmp/app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    url: /study/v3/api-docs
    config-url: /study/v3/api-docs/swagger-config