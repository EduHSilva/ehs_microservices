spring.application.name=admin
server.port=9091
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info,logfile
management.endpoint.health.show-details=always
logging.file.name=${LOG_FILE:/tmp/app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5
spring.boot.admin.discovery.instance-prefer-ip=true
# O nginx envia X-Forwarded-Prefix (/admin) para montar o base href da UI. Se o SBA
# repassar esse header às instâncias, o ForwardedHeaderFilter de cada serviço reescreve
# o path para /admin/actuator/... e o actuator responde 401/404.
spring.boot.admin.instance-proxy.ignored-headers=X-Forwarded-Prefix

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info
