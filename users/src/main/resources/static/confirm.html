<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-mail confirmado — EHS Solutions</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#216B4F">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16170F">
  <style>
    :root {
      color-scheme: light;
      --font-body: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --font-heading: "Fraunces", Georgia, "Times New Roman", serif;
      --bg: #f5f2ea;
      --surface: #fffdf8;
      --text: #26221c;
      --muted: #6b6459;
      --border: #e7e0d3;
      --primary: #216b4f;
      --success: #2f7d5b;
      --success-soft: #e5f2ea;
      --shadow-pop: 0 24px 60px -28px rgba(32, 28, 18, .45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #16170f;
        --surface: #1e1f18;
        --text: #f1ecdf;
        --muted: #b6afa0;
        --border: #2f3027;
        --primary: #7cc9a2;
        --success: #8ad3a6;
        --success-soft: #1d3326;
        --shadow-pop: 0 24px 60px -24px rgba(0, 0, 0, .65);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(820px 420px at 50% -10%, color-mix(in srgb, var(--success-soft) 80%, transparent), transparent 65%),
        var(--bg);
      color: var(--text);
      font: 400 15px/1.65 var(--font-body);
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(440px, 100%);
      padding: 36px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-pop);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
    }
    .mark svg { width: 22px; height: 22px; }
    h2 {
      margin: 0 0 8px;
      font: 600 1.4rem/1.2 var(--font-heading);
      letter-spacing: -.022em;
      color: var(--text);
    }
    p { margin: 0; color: var(--muted); }
    @media (max-width: 420px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </span>
    <h2>Email confirmado com sucesso!</h2>
    <p>Agora você já pode fechar essa aba.</p>
  </main>
</body>
</html>
