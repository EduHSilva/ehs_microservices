spring.application.name=users
server.port=8181

spring.datasource.url=jdbc:postgresql://localhost:5433/users
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
broker.queue.email.name=default.notifications

server.url=http://localhost:4000
server.max-http-request-header-size=64KB

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

api.security.token.secret=${API_SECURITY_TOKEN_SECRET:local-dev-secret}
google.client-id=${GOOGLE_CLIENT_ID:}
admin.email=${ADMIN_EMAIL:admin@example.com}
admin.password=${ADMIN_PASSWORD:change-me}
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info,metrics,loggers,logfile
management.endpoint.health.show-details=always
logging.file.name=${LOG_FILE:/tmp/app.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=5

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/users/v3/api-docs
springdoc.swagger-ui.config-url=/users/v3/api-docs/swagger-config

eureka.instance.metadata-map.swagger-url=http://localhost/users/swagger-ui/index.html